<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 360" width="500" height="360">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#05070f" />
    </linearGradient>

    <!-- Outer Border Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.6" />
    </linearGradient>

    <!-- Accent Pill Gradient -->
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .outer-shell { fill: url(#bgGrad); stroke: url(#borderGrad); stroke-width: 1.5px; rx: 12px; }
    .title-bar { fill: #1e293b; fill-opacity: 0.6; stroke: #334155; stroke-width: 1px; }
    .dot-red { fill: #ff5f56; }
    .dot-yellow { fill: #ffbd2e; }
    .dot-green { fill: #27c93f; }
    .text-title { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #94a3b8; font-weight: 600; letter-spacing: 0.5px; }
    
    .prompt { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 13px; fill: #38bdf8; font-weight: 700; }
    .key { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12.5px; fill: #a78bfa; font-weight: 600; }
    .val { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12.5px; fill: #e2e8f0; }
    .accent-text { fill: #34d399; font-weight: 700; }
    .badge-bg { fill: url(#pillGrad); rx: 4px; }
    .badge-text { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 10px; fill: #ffffff; font-weight: 700; }

    @keyframes slideIn {
      0% { opacity: 0; transform: translateY(10px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .line { animation: slideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
  </style>

  <!-- Outer Double-Bezel Card -->
  <rect width="100%" height="100%" class="outer-shell" />
  
  <!-- Header Bar -->
  <path d="M 0 12 A 12 12 0 0 1 12 0 L 488 0 A 12 12 0 0 1 500 12 L 500 36 L 0 36 Z" class="title-bar" />
  <circle cx="22" cy="18" r="5" class="dot-red" />
  <circle cx="38" cy="18" r="5" class="dot-yellow" />
  <circle cx="54" cy="18" r="5" class="dot-green" />
  <text x="250" y="22" text-anchor="middle" class="text-title">~/codebylalit/profile.sh (neofetch)</text>

  <!-- Terminal Content Lines -->
  <g transform="translate(24, 70)">
    <g class="line" style="animation-delay: 0.10s;">
      <text x="0" y="0" class="prompt">❯</text>
      <text x="18" y="0" class="key">User</text>
      <text x="120" y="0" class="val">Lalit Namdev (@codebylalit)</text>
    </g>

    <g class="line" style="animation-delay: 0.22s;" transform="translate(0, 32)">
      <text x="0" y="0" class="prompt">❯</text>
      <text x="18" y="0" class="key">Role</text>
      <text x="120" y="0" class="val">Frontend Engineer &amp; Micro-SaaS Builder</text>
    </g>

    <g class="line" style="animation-delay: 0.34s;" transform="translate(0, 64)">
      <text x="0" y="0" class="prompt">❯</text>
      <text x="18" y="0" class="key">Tech Stack</text>
      <text x="120" y="0" class="val">React, React Native, TypeScript, Next.js</text>
    </g>

    <g class="line" style="animation-delay: 0.46s;" transform="translate(0, 96)">
      <text x="0" y="0" class="prompt">❯</text>
      <text x="18" y="0" class="key">Core Focus</text>
      <text x="120" y="0" class="val">AI Products, WebGL/Canvas, Serverless</text>
    </g>

    <g class="line" style="animation-delay: 0.58s;" transform="translate(0, 128)">
      <text x="0" y="0" class="prompt">❯</text>
      <text x="18" y="0" class="key">Builds</text>
      <text x="120" y="0" class="val">Skooty, Invoicelly, NenoBanana, Hashly</text>
    </g>

    <g class="line" style="animation-delay: 0.70s;" transform="translate(0, 160)">
      <text x="0" y="0" class="prompt">❯</text>
      <text x="18" y="0" class="key">Honors</text>
      <text x="120" y="0" class="val accent-text">🏆 Top 50 Finalist @ Odoo Hackathon</text>
    </g>

    <g class="line" style="animation-delay: 0.82s;" transform="translate(0, 192)">
      <text x="0" y="0" class="prompt">❯</text>
      <text x="18" y="0" class="key">Location</text>
      <text x="120" y="0" class="val">Ahmedabad, India 🇮🇳 (UTC+05:30)</text>
    </g>

    <g class="line" style="animation-delay: 0.94s;" transform="translate(0, 226)">
      <rect x="0" y="-12" width="70" height="18" class="badge-bg" />
      <text x="35" y="0" text-anchor="middle" class="badge-text">STATUS</text>
      <text x="82" y="0" class="val" style="fill: #f472b6;">🚀 Shipping Next-Gen AI Micro-SaaS</text>
    </g>
  </g>
</svg>